<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم - إدارة الامتحانات والنتائج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>

    <!-- ربط فايربيز (Firebase SDK v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdo4VL4nwboZXbzXn2DRlKQ6F0mYZ9qH0",
            authDomain: "exam-d4df3.firebaseapp.com",
            projectId: "exam-d4df3",
            storageBucket: "exam-d4df3.firebasestorage.app",
            messagingSenderId: "626378875513",
            appId: "1:626378875513:web:cd84497b8ae0cb320ceaa8",
            measurementId: "G-36SQM4CLL2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // التحكم في إظهار خيارات الأسئلة بناءً على النوع
        window.handleTypeChange = function() {
            const type = document.getElementById('q-type').value;
            const mcqBox = document.getElementById('mcq-options');
            const tfBox = document.getElementById('tf-options');

            if (type === 'mcq') {
                mcqBox.classList.remove('hidden');
                tfBox.classList.add('hidden');
            } else if (type === 'tf') {
                mcqBox.classList.add('hidden');
                tfBox.classList.remove('hidden');
            } else {
                mcqBox.classList.add('hidden');
                tfBox.classList.add('hidden');
            }
        };

        // حفظ سؤال جديد في بنك الأسئلة على السحاب
        window.saveQuestion = async function() {
            const grade = document.getElementById('q-grade').value;
            const type = document.getElementById('q-type').value;
            const text = document.getElementById('q-text').value.trim();
            const points = parseInt(document.getElementById('q-points').value) || 1;

            if(!text) {
                alert('يرجى كتابة نص السؤال!');
                return;
            }

            let options = [];
            let correct = 0;

            if (type === 'mcq') {
                const opt1 = document.getElementById('opt-1').value.trim();
                const opt2 = document.getElementById('opt-2').value.trim();
                const opt3 = document.getElementById('opt-3').value.trim();
                const opt4 = document.getElementById('opt-4').value.trim();
                correct = parseInt(document.getElementById('q-correct-mcq').value);

                if(!opt1 || !opt2) {
                    alert('يرجى إدخال خيارين على الأقل للأسئلة الاختيارية!');
                    return;
                }
                options = [opt1, opt2, opt3, opt4].filter(o => o !== "");
            } else if (type === 'tf') {
                options = ["صح", "خطأ"];
                correct = parseInt(document.getElementById('q-correct-tf').value);
            } else {
                options = [];
                correct = -1;
            }

            try {
                await addDoc(collection(db, "exam_questions"), {
                    grade,
                    type,
                    text,
                    points,
                    options,
                    correct,
                    createdAt: new Date().toISOString()
                });
                alert('تم حفظ السؤال بنجاح في السحاب!');
                document.getElementById('q-text').value = '';
                document.getElementById('opt-1').value = '';
                document.getElementById('opt-2').value = '';
                document.getElementById('opt-3').value = '';
                document.getElementById('opt-4').value = '';
                window.loadQuestions();
            } catch(e) {
                console.error(e);
                alert('حدث خطأ أثناء حفظ السؤال');
            }
        };

        // تحميل الأسئلة من السحاب
        window.loadQuestions = async function() {
            const container = document.getElementById('questions-list');
            container.innerHTML = '<p class="text-slate-400">جاري التحميل...</p>';
            try {
                const querySnapshot = await getDocs(collection(db, "exam_questions"));
                container.innerHTML = '';
                if(querySnapshot.empty) {
                    container.innerHTML = '<p class="text-slate-400">لا توجد أسئلة مضافة حتى الآن.</p>';
                    return;
                }
                querySnapshot.forEach((docSnap) => {
                    let q = docSnap.data();
                    let typeBadge = q.type === 'mcq' ? 'اختر من متعدد' : (q.type === 'tf' ? 'صح أو خطأ' : 'علل / مقالي');
                    container.innerHTML += `
                        <div class="p-3 border rounded-xl bg-slate-50 flex justify-between items-center">
                            <div>
                                <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded font-bold">${q.grade}</span>
                                <span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">${typeBadge}</span>
                                <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">${q.points || 1} درجات</span>
                                <p class="font-bold mt-1 text-slate-800">${q.text}</p>
                            </div>
                            <button onclick="deleteQuestion('${docSnap.id}')" class="text-red-500 font-bold hover:text-red-700 cursor-pointer text-sm">حذف</button>
                        </div>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        };

        window.deleteQuestion = async function(id) {
            if(confirm('هل أنت متأكد من حذف هذا السؤال؟')) {
                await deleteDoc(doc(db, "exam_questions", id));
                window.loadQuestions();
            }
        };

        // تحميل النتائج مع رابط الواتساب الجاهز لولي الأمر
        window.loadSubmissions = async function() {
            const container = document.getElementById('submissions-list');
            container.innerHTML = '<p class="text-slate-400">جاري تحميل النتائج...</p>';
            try {
                const querySnapshot = await getDocs(collection(db, "exam_submissions"));
                container.innerHTML = '';
                if(querySnapshot.empty) {
                    container.innerHTML = '<p class="text-slate-400">لا توجد نتائج مسجلة حتى الآن.</p>';
                    return;
                }
                querySnapshot.forEach((docSnap) => {
                    let sub = docSnap.data();
                    
                    // تجهيز رقم ولي الأمر بصيغة دولية (+20) وإعداد نص رسالة الواتساب الجاهزة
                    let parentPhoneFormatted = sub.parentPhone ? sub.parentPhone.replace(/^0/, '+20') : '';
                    let whatsappMessage = encodeURIComponent(`السلام عليكم ورحمة الله وبركاته، ولي أمر الطالب/ة (${sub.studentName}). نود إبلاغكم بأن الطالب أدى امتحان (${sub.grade}) وحصل على نتيجة: (${sub.score}). مع أطيب الأمنيات بالتوفيق!`);
                    let whatsappUrl = `https://wa.me/${parentPhoneFormatted}?text=${whatsappMessage}`;

                    container.innerHTML += `
                        <div class="p-4 border rounded-xl bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div>
                                <h4 class="font-bold text-indigo-900">${sub.studentName}</h4>
                                <p class="text-xs text-slate-600 mt-1">هاتف الطالب: ${sub.studentPhone || '-'} | هاتف ولي الأمر: ${sub.parentPhone || '-'}</p>
                                <p class="text-xs text-slate-500">الصف: ${sub.grade} | تاريخ التسليم: ${sub.date}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-md font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100">
                                    الدرجة: ${sub.score}
                                </span>
                                ${sub.parentPhone ? `
                                    <a href="${whatsappUrl}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1 transition shadow-sm cursor-pointer">
                                        💬 مراسلة ولي الأمر
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            window.loadQuestions();
            window.loadSubmissions();
        });
    </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">لوحة تحكم المعلم - المنصة الشاملة</h1>
        <div class="space-x-2 space-x-reverse">
            <button onclick="switchTab('q')" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg text-sm font-semibold cursor-pointer">إضافة أسئلة</button>
            <button onclick="switchTab('s')" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg text-sm font-semibold cursor-pointer">نتائج الطلاب والتواصل</button>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 max-w-3xl space-y-6 mt-4">
        
        <!-- TAB 1: ADD QUESTIONS -->
        <div id="tab-q" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                <h2 class="text-xl font-bold text-indigo-600">إضافة سؤال جديد لبنك الأسئلة</h2>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-sm font-semibold mb-1">الصف الدراسي:</label>
                        <select id="q-grade" class="w-full p-2.5 border rounded-xl outline-none font-bold bg-slate-50">
                            <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
                            <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
                            <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-1">نوع السؤال:</label>
                        <select id="q-type" onchange="handleTypeChange()" class="w-full p-2.5 border rounded-xl outline-none font-bold bg-slate-50">
                            <option value="mcq">اختر من متعدد</option>
                            <option value="tf">صح أو خطأ</option>
                            <option value="essay">علل / إجابة مقالية</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-1">درجة السؤال:</label>
                        <input type="number" id="q-points" value="1" min="1" max="10" class="w-full p-2.5 border rounded-xl outline-none font-bold bg-slate-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">نص السؤال:</label>
                    <textarea id="q-text" rows="2" class="w-full p-3 border rounded-xl outline-none" placeholder="اكتب نص السؤال هنا..."></textarea>
                </div>

                <!-- خيارات اختر من متعدد -->
                <div id="mcq-options" class="space-y-3">
                    <label class="block text-sm font-semibold">خيارات الإجابة:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="opt-1" class="p-2.5 border rounded-xl" placeholder="الخيار الأول">
                        <input type="text" id="opt-2" class="p-2.5 border rounded-xl" placeholder="الخيار الثاني">
                        <input type="text" id="opt-3" class="p-2.5 border rounded-xl" placeholder="الخيار الثالث">
                        <input type="text" id="opt-4" class="p-2.5 border rounded-xl" placeholder="الخيار الرابع">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">حدد الإجابة الصحيحة:</label>
                        <select id="q-correct-mcq" class="w-full p-2 border rounded-lg bg-slate-50">
                            <option value="0">الخيار الأول</option>
                            <option value="1">الخيار الثاني</option>
                            <option value="2">الخيار الثالث</option>
                            <option value="3">الخيار الرابع</option>
                        </select>
                    </div>
                </div>

                <!-- خيارات صح أو خطأ -->
                <div id="tf-options" class="hidden space-y-2">
                    <label class="block text-sm font-semibold">تحديد الإجابة الصحيحة:</label>
                    <select id="q-correct-tf" class="w-full p-2.5 border rounded-xl bg-slate-50">
                        <option value="0">صح (True)</option>
                        <option value="1">خطأ (False)</option>
                    </select>
                </div>

                <button onclick="saveQuestion()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-3.5 rounded-xl font-bold transition cursor-pointer shadow-sm">حفظ السؤال في بنك الأسئلة</button>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-3">
                <h3 class="font-bold text-lg text-slate-700">الأسئلة الحالية في البنك</h3>
                <div id="questions-list" class="space-y-2"></div>
            </div>
        </div>

        <!-- TAB 2: RESULTS & WHATSAPP PARENT COMMUNICATION -->
        <div id="tab-s" class="hidden bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-700">نتائج الطلاب والتواصل مع أولياء الأمور</h3>
                <button onclick="window.loadSubmissions()" class="bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-lg cursor-pointer">تحديث النتائج 🔄</button>
            </div>
            <div id="submissions-list" class="space-y-3"></div>
        </div>
    </main>

    <script>
        function switchTab(tab) {
            document.getElementById('tab-q').classList.toggle('hidden', tab !== 'q');
            document.getElementById('tab-s').classList.toggle('hidden', tab !== 's');
            if(tab === 's') window.loadSubmissions();
        }
    </script>
</body>
</html>
